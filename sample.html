<!DOCTYPE html>
<html>
<head>
  <title>Type of lists in HTML</title>
</head>
<body style = "background-color: rgb(120,175,229);">
  <h2>Student Info:</h2>
<table border="2">
  <tr>
    <th rowspan="2">Name</th>
    <th colspan="2">Contact Info</th>
  </tr>
  <tr>
    <th>Email</th>
    <th>Phone</th>
  </tr>
  <tr>
    <td>Huzaifa Iqbal</td>
    <td>xxxxx@gmail.com</td>
    <td>0000000000</td>
  </tr>
  <tr>
    <td>Ayan</td>
    <td >yyyyyy@gamil.com</td>
    <td>1111111111</td>
  </tr>
</table>
</body>
</html>
