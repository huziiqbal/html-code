<!DOCTYPE html>
<html>
<head>
<title>Div Borders</title>
<style>
.box1 {border: 2px solid green; margin: 12px; padding: 12px;}
.box2 {border: 4px dashed aqua; margin: 18px; padding: 18px;}
.box3 {border: 6px dotted orange; margin: 24px; padding: 24px;}
</style>
</head>
<body>
<div class="box1">Div One(1)</div>
<div class="box2">Div two(2)</div>
<div class="box3">Div Three(3)</div>
</body>
</html>
